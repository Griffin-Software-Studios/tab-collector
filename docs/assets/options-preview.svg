<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Tab Collector options page preview</title>
  <desc id="desc">Illustrative preview of the options page with Griffin styling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7464a1"/>
      <stop offset="35%" stop-color="#071019"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="40" y="40" width="1120" height="640" rx="28" fill="#0f1727" stroke="#2a3d5f"/>
  <text x="82" y="92" fill="#ff8c42" font-family="Segoe UI, Arial, sans-serif" font-size="18" letter-spacing="4">TAB COLLECTOR</text>
  <text x="82" y="126" fill="#e6eef6" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Options and behavior controls</text>
  <rect x="82" y="162" width="1036" height="96" rx="18" fill="#111c31" stroke="#2a3d5f"/>
  <rect x="82" y="282" width="1036" height="96" rx="18" fill="#111c31" stroke="#2a3d5f"/>
  <rect x="82" y="402" width="1036" height="96" rx="18" fill="#111c31" stroke="#2a3d5f"/>
  <rect x="82" y="522" width="1036" height="96" rx="18" fill="#111c31" stroke="#2a3d5f"/>
  <text x="114" y="198" fill="#e6eef6" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Collector theme</text>
  <text x="114" y="226" fill="#9aa6b2" font-family="Segoe UI, Arial, sans-serif" font-size="17">System default, Light, Dark</text>
  <rect x="930" y="188" width="148" height="42" rx="12" fill="#479bcc"/>
  <text x="968" y="215" fill="#071019" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Theme</text>
  <text x="114" y="318" fill="#e6eef6" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Toolbar action</text>
  <text x="114" y="346" fill="#9aa6b2" font-family="Segoe UI, Arial, sans-serif" font-size="17">Popup, save window, save current tab</text>
  <text x="114" y="438" fill="#e6eef6" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Duplicates and pinned tabs</text>
  <text x="114" y="466" fill="#9aa6b2" font-family="Segoe UI, Arial, sans-serif" font-size="17">Save rules and restore behavior</text>
  <text x="114" y="558" fill="#e6eef6" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Restore and context menu</text>
  <text x="114" y="586" fill="#9aa6b2" font-family="Segoe UI, Arial, sans-serif" font-size="17">Window placement, clipboard, memory-saving restore</text>
  <rect x="940" y="548" width="138" height="42" rx="12" fill="#ff8c42"/>
  <text x="974" y="575" fill="#071019" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Save</text>
</svg>
